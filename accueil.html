<!-- ======================================================= -->
<!--               01. SECTION ACCUEIL (#hero)               -->
<!-- ======================================================= -->
<section id="hero">
  <div class="hero-bg-image"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-text">
      <div class="hero-badge">
        <span class="badge-dot"></span>Disponible pour un stage
      </div>

      <div class="hero-greeting">Bonjour, je suis</div>

      <h1 class="hero-name">
        <span class="name-line">Mohamed</span>
        <span class="name-line accent-text">Lhikioui</span>
      </h1>

      <p class="hero-subtitle">
        Élève Ingénieur en <span class="highlight-cyan">Génie Digital &amp; IA</span> en Santé<br />
        <span class="fira">2ème année</span> · École <span class="highlight-purple">SupTech Santé</span>
      </p>

      <!-- Badges technologiques -->
      <div class="hero-tags">
        <span class="tag">
          <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.66z"/>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.66z"/>
          </svg>
          IA Médicale
        </span>
        <span class="tag">
          <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          Digital Health
        </span>
        <span class="tag">
          <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          Full Stack
        </span>
        <span class="tag">
          <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          LLM / RAG
        </span>
      </div>

      <!-- Boutons d'action CTA -->
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary">
          <span>Voir mes projets</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </a>
        <a href="#contact" class="btn btn-outline">
          <span>Me contacter</span>
        </a>
      </div>

      <div class="hero-scroll-hint">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>

    <!-- Photo de profil avec halo interactif -->
    <div class="hero-photo">
      <div class="profile-img-wrap">
        <img src="me.jpeg" alt="Mohamed Lhikioui - Élève Ingénieur en Génie Digital et IA en Santé"
          class="profile-img" />
        <div class="profile-img-glow"></div>
        <div class="profile-img-ring"></div>
      </div>
    </div>
  </div>

  <!-- Compteurs statistiques -->
  <div class="hero-stats">
    <div class="stat-item">
      <span class="stat-num" data-target="5">0</span>
      <span class="stat-plus">+</span>
      <span class="stat-label">Projets</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num" data-target="12">0</span>
      <span class="stat-plus">+</span>
      <span class="stat-label">Technologies</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num" data-target="2">0</span>
      <span class="stat-label">Années d'études</span>
    </div>
  </div>
</section>
