<!-- ======================================================= -->
<!--               01. SECTION ACCUEIL (#hero)               -->
<!-- ======================================================= -->
<section id="hero">
  <div class="hero-bg-image"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-text">
      <div class="hero-badge">
        <span class="badge-dot"></span>Disponible pour un stage
      </div>

      <div class="hero-greeting">Bonjour, je suis</div>

      <h1 class="hero-name">
        <span class="name-line">Mohamed</span>
        <span class="name-line">Lhikioui</span>
      </h1>

      <p class="hero-subtitle">
        Élève Ingénieur en <strong>Génie Digital &amp; IA</strong> en Santé<br />
        <span class="fira">2ème année</span> · École <strong>SupTech Santé</strong>
      </p>

      <!-- 4 capsules technologiques en verre (style mockup) -->
      <div class="hero-pills">
        <div class="hero-pill">
          <div class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.66z"/>
              <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.66z"/>
            </svg>
          </div>
          <span class="pill-label">IA Médicale</span>
        </div>

        <div class="hero-pill">
          <div class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h5l3-8 4 16 3-8h5"/>
            </svg>
          </div>
          <span class="pill-label">Digital Health</span>
        </div>

        <div class="hero-pill">
          <div class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 7 4 12 9 17"/>
              <polyline points="15 7 20 12 15 17"/>
            </svg>
          </div>
          <span class="pill-label">Full Stack</span>
        </div>

        <div class="hero-pill">
          <div class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
          </div>
          <span class="pill-label">LLM / RAG</span>
        </div>
      </div>

      <!-- Boutons d'action CTA -->
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary">
          <span>Voir mes projets</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </a>
        <a href="#contact" class="btn btn-outline">
          <span>Me contacter</span>
        </a>
      </div>

      <div class="hero-scroll-hint">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>

    <!-- Photo de profil avec halo interactif et badge SupTech (conserve me.jpeg) -->
    <div class="hero-photo">
      <div class="profile-img-wrap">
        <img src="me.jpeg" alt="Mohamed Lhikioui - Élève Ingénieur en Génie Digital et IA en Santé"
          class="profile-img" />
        <div class="profile-img-glow"></div>
        <div class="profile-img-ring"></div>
        <div class="profile-badge-suptech">
          <span>SupTech Santé</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Compteurs statistiques -->
  <div class="hero-stats">
    <div class="stat-item">
      <span class="stat-num" data-target="5">0</span>
      <span class="stat-plus">+</span>
      <span class="stat-label">Projets</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num" data-target="12">0</span>
      <span class="stat-plus">+</span>
      <span class="stat-label">Technologies</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-num" data-target="2">0</span>
      <span class="stat-label">Années d'études</span>
    </div>
  </div>
</section>
