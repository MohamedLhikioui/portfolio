<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Portfolio de Mohamed Lhikioui — Élève Ingénieur en Génie Digital et IA en Santé à l'École SupTech Santé." />
  <meta name="author" content="Mohamed Lhikioui" />
  <title>Mohamed Lhikioui — Portfolio | Ingénieur Génie Digital &amp; IA Santé</title>

  <!-- Polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Feuille de styles principale -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Fond de particules interactives et barre de progression -->
  <canvas id="particles-canvas"></canvas>
  <div id="scroll-progress"></div>

  <!-- ======================================================= -->
  <!--               00. BARRE DE NAVIGATION                   -->
  <!-- ======================================================= -->
  <nav id="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">
        <span class="logo-bracket">&lt;</span>ML<span class="logo-bracket">/&gt;</span>
      </a>

      <!-- Bouton menu burger (mobile) -->
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu de navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Liens de navigation -->
      <ul class="nav-links" id="nav-links">
        <li><a href="#hero" class="nav-link active">Accueil</a></li>
        <li><a href="#about" class="nav-link">À propos</a></li>
        <li><a href="#skills" class="nav-link">Compétences</a></li>
        <li><a href="#projects" class="nav-link">Projets</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- ======================================================= -->
  <!--               CONTENEUR PRINCIPAL MODULAIRE             -->
  <!-- ======================================================= -->
  <main id="main-content" role="main">
    <!-- Placeholder visuel pendant le chargement asynchrone -->
    <div class="modular-loader" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; color: #00F0FF; font-family: 'Fira Code', monospace; font-size: 1rem;">
      <span>Chargement des modules...</span>
    </div>
  </main>

  <!-- ======================================================= -->
  <!--               06. PIED DE PAGE (#footer)                -->
  <!-- ======================================================= -->
  <footer id="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <span class="logo-bracket">&lt;</span>ML<span class="logo-bracket">/&gt;</span>
        </div>
        <p class="footer-tagline">Ingénieur Digital &amp; IA · SupTech Santé</p>
        <div class="footer-links">
          <a href="#hero">Accueil</a>
          <a href="#about">À propos</a>
          <a href="#skills">Compétences</a>
          <a href="#projects">Projets</a>
          <a href="#contact">Contact</a>
        </div>
        <p class="footer-copy">
          © 2026 Mohamed Lhikioui — Conçu &amp; développé avec
          <svg class="footer-heart-icon" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </p>
      </div>
    </div>

    <!-- Bouton Retour en haut -->
    <button id="back-to-top" aria-label="Retour en haut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 15l-6-6-6 6" />
      </svg>
    </button>
  </footer>

  <!-- Script principal modulaire -->
  <script src="script.js" defer></script>
</body>

</html>
